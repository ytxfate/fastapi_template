[project]
name = "fastapi-template"
version = "0.1.0"
description = "fastapi template"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "elasticsearch==7.12.0",
    "fastapi==0.136.3",
    "openpyxl==3.1.5",
    "pymongo==4.17.0",
    "python-multipart==0.0.32",
    "redis==5.3.1",
    "slowapi==0.1.9",
    "uvicorn==0.49.0",
]
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
[tool.ruff.lint.per-file-ignores]
"project/app.py" = ["F401", "E402"]
[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "slow: 标记为慢速测试",
    "integration: 集成测试，需要外部服务",
]
norecursedirs = [".git", ".venv", "venv", "__pycache__", "dist", "build"]
minversion = "7.0"
pythonpath = "."
